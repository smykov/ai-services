name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, asr, tts-gpu, tts-cpu, surya, avatar]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ecosystem/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    needs: build-and-push
    runs-on: [self-hosted, proxmox, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to the GPU VM via jump host
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST }}
          VM110_HOST: ${{ secrets.VM110_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            -J root@$PROXMOX_HOST \
            root@$VM110_HOST "
            mkdir -p /opt/ecosystem-ai-services
          "
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            -o ProxyJump=root@$PROXMOX_HOST \
            deploy/docker-compose.demo.yml \
            root@$VM110_HOST:/opt/ecosystem-ai-services/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            -J root@$PROXMOX_HOST \
            root@$VM110_HOST "
            cd /opt/ecosystem-ai-services &&
            IMAGE_TAG=${{ github.ref_name }} \
            docker compose -f docker-compose.demo.yml pull &&
            docker compose -f docker-compose.demo.yml up -d
          "
