name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, asr, tts-gpu, tts-cpu, surya, avatar]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-services-${{ matrix.service }}
          # type=ref keeps the "v" (v1.2.3), which is what IMAGE_TAG in the cloud compose expects.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The GPU VM runs the demo stack from a git checkout and builds images there, so this job
  # does not wait for the registry images above.
  deploy-demo:
    runs-on: [self-hosted, proxmox, linux]
    concurrency: deploy-demo
    steps:
      - uses: actions/checkout@v4
      # "ai-services-vm" is a Host alias in the runner user's ~/.ssh/config (address, user, key).
      - name: Deploy to the GPU VM
        run: ssh -o BatchMode=yes ai-services-vm bash -s -- "$GITHUB_SHA" < deploy/deploy-demo.sh
