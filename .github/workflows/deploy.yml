name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, asr, tts-gpu, tts-cpu, surya]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ecosystem/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-demo:
    needs: build-and-push
    runs-on: [self-hosted, proxmox, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VM 110
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          HOST: ${{ secrets.DEMO_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy/docker-compose.demo.yml \
            $HOST:/opt/ecosystem-ai-services/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $HOST "
            cd /opt/ecosystem-ai-services &&
            export TAG=${{ github.ref_name }} &&
            docker compose -f docker-compose.demo.yml pull &&
            docker compose -f docker-compose.demo.yml up -d
          "
