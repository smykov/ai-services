name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --fix .
      - run: ruff check .

  test-gateway:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        command: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements.txt pytest httpx pytest-asyncio
      - run: |
          cd gateway
          AI_REDIS_URL=redis://localhost:6379/0 \
          AI_MINIO_ENDPOINT=localhost:9000 \
          AI_MINIO_ACCESS_KEY=minioadmin \
          AI_MINIO_SECRET_KEY=minioadmin \
          python -m pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, asr, tts-gpu, tts-cpu, surya]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ghcr.io/ecosystem/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
