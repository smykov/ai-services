services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # minio/minio is no longer on Docker Hub
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ../
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AI_REDIS_URL: redis://redis:6379/0
      AI_MINIO_ENDPOINT: minio:9000
      AI_MINIO_PUBLIC_ENDPOINT: "${AI_MINIO_PUBLIC_ENDPOINT:-localhost:9000}"  # host:port clients use for download links
      AI_MINIO_ACCESS_KEY: minioadmin
      AI_MINIO_SECRET_KEY: minioadmin
      AI_MINIO_BUCKET: ai-services
      AI_MAX_UPLOAD_SIZE_MB: 100
      AI_LLM_BASE_URL: http://ollama:11434/v1
      AI_LLM_MODEL: "${AI_LLM_MODEL:-qwen2.5:7b}"
      AI_VISION_MODEL: "${AI_VISION_MODEL:-qwen2.5vl:7b}"  # must exist in the ollama service below, see ollama-pull
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  asr:
    build:
      context: ../
      dockerfile: asr/Dockerfile
    profiles:
      - gpu-workers
    volumes:
      - asr_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ai-services
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  tts-gpu:
    build:
      context: ../
      dockerfile: tts-gpu/Dockerfile
    profiles:
      - gpu-workers
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ai-services
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  avatar:
    build:
      context: ../
      dockerfile: avatar/Dockerfile
    profiles:
      - gpu-workers
    volumes:
      - avatar_models:/models
      - avatar_cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ai-services
      AVATAR_IDLE_UNLOAD_S: "300"
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  tts-cpu:
    build:
      context: ../
      dockerfile: tts-cpu/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ai-services
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    profiles:
      - cpu-tts

  ollama:
    image: ollama/ollama:0.19.0
    profiles:
      - gpu-workers
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0
      # The GPU is shared with ASR/TTS/OCR/avatar. With the default 32k context qwen2.5vl:7b
      # does not fit the free VRAM, falls back to CPU and fails on system memory.
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_FLASH_ATTENTION: 1

  # Pulls the gateway's models into the ollama service's own volume. The host may run a
  # separate Ollama with other models; the gateway never sees it.
  ollama-pull:
    image: ollama/ollama:0.19.0
    profiles:
      - gpu-workers
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "${AI_LLM_MODEL:-qwen2.5:7b}" && ollama pull "${AI_VISION_MODEL:-qwen2.5vl:7b}"
    depends_on:
      - ollama
    restart: "no"

  surya:
    build:
      context: ../
      dockerfile: surya/Dockerfile
    profiles:
      - gpu-workers
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ai-services
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  redis_data:
  minio_data:
  ollama_data:
  asr_models:
  avatar_models:
  avatar_cache:
