[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["gateway/tests", "shared/tests"]
asyncio_mode = "auto"
markers = ["real_llm: run against the real LLMService.chat_completions instead of the autouse mock"]
